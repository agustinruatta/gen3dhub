[project]
name = "model-selector"
version = "0.1.0"
description = "TUI/CLI to download, configure, and run AI models (image-to-3D, text-to-3D, etc.) with isolated per-model environments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agustin Ruatta" }]
dependencies = [
    "typer>=0.12.5",
    "rich>=13.9.4",
    "textual>=0.85.0",
    "questionary>=2.0.1",
    "huggingface-hub>=0.26.0",
    "pillow>=10.4.0",
]

[project.scripts]
model-selector = "model_selector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_selector"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
